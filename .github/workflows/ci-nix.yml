  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: cachix/install-nix-action@v30
  #     - name: Rebuild and compare
  #       run: |
  #         nix build .#container.${{ matrix.app }} -L --rebuild
  #         # Compare against the tarball uploaded by build-image (download-artifact).
