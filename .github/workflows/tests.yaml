name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install capnp dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y capnproto libcapnp-dev
      - name: Install capnp dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install capnp
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: cargo-inputs-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      # Each crate is tested on its own: `--workspace` would unify `stratum-apps`
      # features across every member, so an app would be tested against features
      # it does not enable when it is released or published.
      #
      # The integration tests need external binaries and run in their own workflow.
      - name: Test stratum-apps with all features
        run: cargo test -p stratum-apps --all-features
      - name: Test pool
        run: cargo test -p pool_sv2
      - name: Test jd-server
        run: cargo test -p jd_server_sv2
      - name: Test jd-client
        run: cargo test -p jd_client_sv2
      - name: Test translator
        run: cargo test -p translator_sv2
      - name: Test bitcoin-core-sv2 crate
        run: cargo test -p bitcoin_core_sv2

  windows:
    name: Windows build and portable tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
      - name: Install Cap'n Proto compiler and schemas
        run: |
          vcpkg install capnproto:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/capnproto" >> $env:GITHUB_PATH
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: cargo-inputs-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      # Direct Bitcoin Core IPC is unavailable through Tokio on Windows. Cover
      # the pool's TCP template-provider path and the standalone test miner.
      - name: Build pool
        run: cargo build --locked -p pool_sv2 --bin pool_sv2
      - name: Build mining device
        run: cargo build --locked -p integration_tests_sv2 --bin mining_device
      - name: Test IPC backend selection
        run: cargo test --locked -p bitcoin_core_sv2 --lib
      - name: Test shared artifact and port locks
        run: cargo test --locked -p integration_tests_sv2 --lib file_lock_tests
      - name: Test mining hashes
        run: cargo test --locked -p integration_tests_sv2 --test mining_device_fast_hasher_equivalence
