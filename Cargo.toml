[workspace]
resolver = "3"

members = [
    "bitcoin-core-sv2",
    "stratum-apps",
    "pool-apps/pool",
    "pool-apps/jd-server",
    "miner-apps/jd-client",
    "miner-apps/translator",
    "integration-tests",
]

# The integration tests drive real `bitcoind` and template provider binaries, so
# they are run explicitly with `-p integration_tests_sv2` rather than being
# picked up by a bare `cargo build`/`cargo test` at the repository root.
default-members = [
    "bitcoin-core-sv2",
    "stratum-apps",
    "pool-apps/pool",
    "pool-apps/jd-server",
    "miner-apps/jd-client",
    "miner-apps/translator",
]

# Override dependencies with local paths
# Temporary: builds against the companion stratum PR's branch until it lands upstream.
[patch."https://github.com/stratum-mining/stratum"]
stratum-core = { git = "https://github.com/bit-aloo/stratum", branch = "2026-09-29-buffer-sv2-refactor" }
